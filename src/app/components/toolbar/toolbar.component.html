<div class="toolbar">
	<div class="toolbar__left">
		<button class="btn btn--primary" (click)="triggerUpload()" id="upload-btn">
			<span>⬆️</span> Upload
		</button>
		<input
			#fileInput
			type="file"
			multiple
			style="display:none"
			(change)="onFilesSelected($event)"
			id="file-input"
		/>

		@if (showNewFolderInput) {
			<div class="toolbar__new-folder">
				<input
					#newFolderInput
					class="toolbar__folder-input"
					type="text"
					[(ngModel)]="newFolderName"
					placeholder="Folder name"
					(keydown.enter)="submitNewFolder()"
					(keydown.escape)="cancelNewFolder()"
					(blur)="cancelNewFolder()"
					autocomplete="off"
				/>
				<button class="btn btn--primary btn--sm" (mousedown)="submitNewFolder()">Create</button>
				<button class="btn btn--ghost btn--sm" (mousedown)="cancelNewFolder()">✕</button>
			</div>
		} @else {
			<button class="btn btn--ghost" (click)="startNewFolder()" id="new-folder-btn">
				<span>📁</span> New Folder
			</button>
		}
	</div>

	<div class="toolbar__right">
		<div class="toolbar__sort">
			<label class="toolbar__label">Sort</label>
			<select
				class="toolbar__select"
				[value]="sortField"
				(change)="onSortFieldChange($event)"
			>
				<option value="name">Name</option>
				<option value="modification">Date</option>
				<option value="size">Size</option>
			</select>
			<button
				class="btn btn--icon"
				[title]="sortOrder === 'asc' ? 'Ascending' : 'Descending'"
				(click)="toggleSortOrder()"
			>
				{{ sortOrder === 'asc' ? '↑' : '↓' }}
			</button>
		</div>

		<div class="toolbar__view-toggle">
			<button
				class="btn btn--icon"
				[class.btn--icon-active]="viewMode === 'grid'"
				title="Grid view"
				(click)="viewModeChange.emit('grid')"
				id="view-grid-btn"
			>⊞</button>
			<button
				class="btn btn--icon"
				[class.btn--icon-active]="viewMode === 'list'"
				title="List view"
				(click)="viewModeChange.emit('list')"
				id="view-list-btn"
			>≡</button>
		</div>
	</div>
</div>
